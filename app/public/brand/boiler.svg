<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 1.5 74 95">
  <!-- B6 full potbelly, flared legs (short cut), flat silhouette with seam
       articulation. One ink body (#24221c, the lockup's STOVE ink), fills
       only: the belly ellipse is grown to rx 34.5 / ry 31.5 to absorb its old
       5-unit outline, and the legs are clipped 2.5 units clear of the belly
       (a donut clip around rx 37 / ry 34) so every part keeps the same breath
       the chimney cap has naturally. The flame is the yellow-5/orange-8 pair,
       its dark edge doing the outlining — the same pair as the standalone
       flame mark, and orange-8 is the wordmark's HOT color. Flame seated by
       visual centroid: the anchor path's optical center is (50.31, 44.93), so
       translate(24.85,33.54) scale(.50) lands it on the belly's center
       (50, 56). -->
  <defs>
    <clipPath id="legroom">
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M13 1.5 H87 V96.5 H13 Z M87 56 a37 34 0 1 1 -74 0 a37 34 0 1 1 74 0 Z"/>
    </clipPath>
  </defs>
  <rect x="44" y="6" width="12" height="13" rx="2" fill="#24221c"/>
  <rect x="40" y="16" width="20" height="6" rx="2" fill="#24221c"/>
  <g clip-path="url(#legroom)">
    <rect x="34.2" y="77" width="6.8" height="19" rx="3.2" transform="rotate(20 37.6 85)" fill="#24221c"/>
    <rect x="59" y="77" width="6.8" height="19" rx="3.2" transform="rotate(-20 62.4 85)" fill="#24221c"/>
  </g>
  <ellipse cx="50" cy="56" rx="34.5" ry="31.5" fill="#24221c"/>
  <g transform="translate(24.85,33.54) scale(.50)">
    <path d="M50 6c7 15 24 21 24 44a24 24 0 0 1-48 0c0-9.4 4.2-16 8.6-21.4-.4 8.8 2.6 13.6 7.6 14.7C38.6 30 43.3 14.8 50 6Z" fill="#fcc419" stroke="#e8590c" stroke-width="7.5" stroke-linejoin="round"/>
  </g>
</svg>
