<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The game's brand face for a miss. worker.js owns misses now — a
         navigation to a path that is not the game redirects to the game on
         that host — so this page is no longer the mechanism, and it is
         reached only by asking for it directly (/404.html, or ?review to
         stay on it). noindex so it never enters the index.

         The body is the static boot card's masthead recipe (index.html
         #static-boot), because for the one frame — or one direct visit —
         this page is ever seen, it should look like the game it is about to
         become. Nunito itself can't load here (the woff2 is a hashed bundle
         asset), so the stack opens at the same rounded fallbacks the boot
         card falls to on a cold first visit. -->
    <meta name="robots" content="noindex" />
    <!-- The redirect is a script honoring `?review` (open /404.html?review to
         look at this page without being bounced — there is no other way to
         see a page that leaves in 0 seconds), with a meta refresh inside
         noscript so agents without JS still get sent home. Between them
         every agent is covered, which was the meta-only version's whole
         argument.

         "./" rather than an absolute path, because the game answers on two
         mounts and this one target has to mean both: from /404.html it
         resolves to hotstove.io's root, and from /games/hot-stove/404.html to
         that prefix. This works only because worker.js no longer serves this
         page on a miss — it resolves misses by request type instead, so the
         page is reached at its own asset path and nowhere else. Restoring
         not_found_handling would serve it at whatever URL missed, where "./"
         resolves to that URL's parent; these would have to go back to being
         absolute, and absolute can only name one mount. -->
    <script>
      if (!new URLSearchParams(location.search).has("review")) {
        location.replace("./");
      }
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./" /></noscript>
    <!-- The game's own face, from the same paint-blocking data-URI sheet the
         app uses — relative like the redirect's, and portable across both
         mounts for the same reason. Locally (preview at /) it 404s and the
         rounded fallback stack below carries the card; in production the
         masthead is pixel-true to the boot card. -->
    <link rel="stylesheet" href="./nunito.css" />
    <link rel="stylesheet" href="./brand.css" />
    <title>Hot Stove</title>
    <style>
      html {
        background: #f6f1e3;
      }
      body {
        margin: 0;
        font-family: 'Nunito', ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
        line-height: 1;
        color: #24221c;
      }
      /* The RAIN DELAY pill's recipe (SpinBanner .retry + the chipbox
         capsule), inlined because the bundle CSS can't load here. The emoji
         is its own geometric flex item and the words are their own cap band;
         treating both as one font run gave the ball an OS-dependent side
         bearing and pulled the label off center. */
      .foul {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 30px;
        padding: 0 11px;
        gap: 6px;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.04em;
        white-space: nowrap;
        color: #24221c;
        text-decoration: none;
        background: #fffdf6;
        border: 2px solid #57534a;
        border-radius: 999px;
        transition: transform 0.08s;
      }
      .foul-ball {
        display: block;
        flex: none;
        font-family: inherit;
        font-size: inherit;
        line-height: 1;
      }
      .foul-copy {
        display: block;
        line-height: 1;
      }
      @supports (text-box: trim-both cap alphabetic) {
        .foul-copy { text-box: trim-both cap alphabetic; }
      }
      .foul:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div style="max-width: 480px; margin: 0 auto; padding: 38vh 24px 0; text-align: center">
      <div class="hs-logo hs-logo--home" aria-label="Hot Stove">
        <span class="hs-logo__wordmark"><span class="hs-logo__hot">HOT</span>ST<span class="hs-logo__o" role="img" aria-label="O"></span>VE</span>
      </div>
      <!-- ⚾ FOUL BALL: this URL left the field of play. Same shape as ☔ RAIN
           DELAY — baseball's word for the mishap, then the way back, fused
           into the one pill there is to tap. -->
      <p style="margin: 26px 0 0">
        <a class="foul" href="./" aria-label="Foul ball. This page doesn't exist. Back to the game."><span class="foul-ball" aria-hidden="true">⚾</span><span class="foul-copy">FOUL BALL · BACK TO THE GAME</span></a>
      </p>
    </div>
  </body>
</html>
