<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hot Stove" />
    <!-- Real PNGs, not an SVG data URI — Safari ignores SVG favicons. The 🔥
         in the tab comes from these, so the title stays emoji-free. -->
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="description"
      content="A baseball drafting game. Spin for real team-seasons, sign players at their real salaries, and chase 162 wins."
    />
    <!-- Social cards. og:image is an ABSOLUTE /hot-stove/ URL on purpose: it
         resolves on GitHub Pages today and keeps resolving after the move to
         hedgertronic.com/games/hot-stove, because /hot-stove 301s there and
         scrapers follow redirects. og:url names the forever home. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hedgertronic.com/games/hot-stove/" />
    <meta property="og:title" content="Hot Stove" />
    <meta
      property="og:description"
      content="A baseball drafting game. Spin for real team-seasons, sign players at their real salaries, and chase 162 wins."
    />
    <meta property="og:image" content="https://hedgertronic.com/hot-stove/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hedgertronic" />
    <meta name="twitter:title" content="Hot Stove" />
    <meta
      name="twitter:description"
      content="A baseball drafting game. Spin for real team-seasons, sign players at their real salaries, and chase 162 wins."
    />
    <meta name="twitter:image" content="https://hedgertronic.com/hot-stove/og-image.png" />
    <title>Hot Stove</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-35RY8Y6Q5V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-35RY8Y6Q5V');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
