<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C — Ticket stub</title>
<link rel="stylesheet" href="./base.css">
<style>
  .mast { margin: 5vh 0 18px; }
  .ticket {
    position: relative;
    border: 3px solid var(--ink); border-radius: 16px;
    background: var(--card); padding: 14px 14px 0; overflow: hidden;
  }
  .tk-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 9px; font-weight: 800; letter-spacing: 0.14em; color: var(--muted);
    margin-bottom: 10px;
  }
  .tsep {
    display: flex; align-items: center; gap: 10px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.14em;
    color: var(--muted); padding: 2px 0 8px;
  }
  .tsep::before, .tsep::after { content: ""; flex: 1; border-top: 2px dashed var(--dash); }
  .bar {
    display: grid; overflow: hidden;
    border: 2.5px solid var(--ink); border-radius: 11px;
    background: var(--card); margin-bottom: 12px;
  }
  .bar.two { grid-template-columns: 1fr 1fr; }
  .bar.three { grid-template-columns: repeat(3, 1fr); }
  .segb {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-weight: 800; font-size: 11.5px; white-space: nowrap; padding: 5px 2px;
  }
  .segb + .segb { border-left: 2.5px solid var(--ink); }
  .segb.on { background: var(--amber); color: var(--ink); }
  .sic { font-size: 16px; line-height: 1; }
  /* Perforation: dashed tear line with die-cut notches at both edges. */
  .perf { position: relative; height: 0; border-top: 2.5px dashed var(--gray-ink); margin: 2px -14px 0; }
  .notch {
    position: absolute; top: -11px; width: 22px; height: 22px;
    border: 3px solid var(--ink); border-radius: 50%; background: var(--ground);
  }
  .notch.l { left: -14px; }
  .notch.r { right: -14px; }
  .stub { padding: 14px 0 14px; }
  .playbtn { margin-top: 0; }
</style></head><body>
<div id="app">
  <button class="help">?</button>
  <div class="mast"><span class="logo"><span>HOT<em>STOVE</em></span><span class="beta">BETA</span></span></div>

  <div class="ticket">
    <div class="tk-head"><span>OFFSEASON PASS</span><span>ADMIT ONE GM</span></div>

    <div class="tsep">DIFFICULTY</div>
    <div class="bar two">
      <button class="segb on"><span class="sic">📊</span>Box Score</button>
      <button class="segb"><span class="sic">🔭</span>Eye Test</button>
    </div>

    <div class="tsep">PAYROLL</div>
    <div class="bar three">
      <button class="segb on"><span class="sic">💼</span>Owner's Box</button>
      <button class="segb"><span class="sic">⚾</span>Moneyball</button>
      <button class="segb"><span class="sic">💸</span>Blank Check</button>
    </div>

    <div class="perf"><span class="notch l"></span><span class="notch r"></span></div>
    <div class="stub">
      <button class="btn hot playbtn">PLAY 🔥</button>
      <button class="seedlink">PLAY A SEED #</button>
    </div>
  </div>

  <div class="psep bestsep">RECORD BOOK</div>
  <div class="book">
    <div class="bmode">📊 Box Score · 💼 Owner's Box</div>
    <div class="btable">
      <div class="bcol"><div class="bcap">G</div><div class="bn">2</div></div>
      <div class="bcol"><div class="bcap">BEST RECORD</div><div class="bn">101–61</div></div>
      <div class="bcol"><div class="bcap">BEST SCORE</div><div class="bn gold">101.2</div></div>
    </div>
  </div>
</div>
</body></html>
