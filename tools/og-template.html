<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../app/public/brand.css" />
<style>
  /* 1200×630 social card. This is the approval candidate recovered from the
     Claude identity artifact: current boiler lockup, then the live game's
     spinner/market anatomy for the 1995 Seattle Mariners. No subtitle or
     maker line — the image contains only the identity and the game itself. */
  @font-face {
    font-family: "Nunito";
    src: url("../app/src/assets/nunito.woff2") format("woff2");
    font-weight: 200 1000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    overflow: hidden;
    background: #fffdf6;
    color: #24221c;
    font-family: "Nunito", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .preview {
    width: 800px;
    margin-top: 14px;
    padding: 12px 20px 15px;
    background: #f6f1e3;
    border: 3px solid #57534a;
    border-radius: 20px;
  }
  .banner {
    --franchise: #1f6f6b;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    margin-top: 0;
  }
  .year {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 15px;
    border: 3px solid var(--franchise);
    border-radius: 999px;
    background: color-mix(in srgb, var(--franchise) 18%, #fffdf6);
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .04em;
  }
  .team {
    color: var(--franchise);
    font-size: 30px;
    font-weight: 800;
    line-height: 1.1;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 10px;
  }
  .row {
    width: 100%;
    min-height: 62px;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fffdf6;
    border: 3px solid #57534a;
    border-radius: 15px;
  }
  .pos {
    width: 56px;
    height: 31px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fffdf6;
    color: #24221c;
    border: 2.5px solid #57534a;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .03em;
  }
  .pos.pitcher { background: #24221c; border-color: #24221c; color: #fffdf6; }
  .identity { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name { font-size: 20px; font-weight: 800; white-space: nowrap; }
  .awards { display: inline-flex; gap: 4px; }
  .award {
    height: 22px;
    padding: 0 7px;
    display: inline-flex;
    align-items: center;
    border: 2px solid #57534a;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .02em;
  }
  .cy { background: #a5d8ff; border-color: #1971c2; }
  .mvp { background: #ffd43b; border-color: #c98a08; }
  .gg { background: #d3f0d8; border-color: #2f9e44; }
  .ss { background: #e6e0f5; border-color: #6741d9; }
  .as { background: #fff4d6; border-color: #c98a08; }
  .numbers { margin-left: auto; display: flex; align-items: center; gap: 14px; flex: none; }
  .salary { min-width: 88px; text-align: right; font-size: 19px; font-weight: 800; }
  .salary.spendy { color: #e8590c; }
  .war {
    min-width: 96px;
    padding: 4px 7px;
    text-align: center;
    border: 2.5px solid;
    border-radius: 13px;
    color: #24221c;
    font-size: 19px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .war .unit { margin-left: 4px; font-size: 12px; letter-spacing: .05em; opacity: .85; }
  .war.mid { background: #b2f2bb; border-color: #2f9e44; }
  .war.star { background: #d0bfff; border-color: #6741d9; }
  .war.elite { background: #ffec99; border-color: #c98a08; }
</style>
</head>
<body>
  <div class="hs-logo hs-logo--og" aria-label="Hot Stove">
    <img class="hs-logo__mark" src="../app/public/brand/boiler.svg" alt="" />
    <span class="hs-logo__wordmark"><span class="hs-logo__hot">HOT</span>STOVE</span>
  </div>

  <div class="preview" aria-label="Gameplay preview: 1995 Seattle Mariners player market">
    <div class="banner">
      <span class="year">1995</span>
      <div class="team">Seattle Mariners</div>
    </div>

    <div class="rows">
    <div class="row">
      <span class="pos pitcher">SP</span>
      <span class="identity">
        <span class="name">Randy Johnson</span>
        <span class="awards"><span class="award cy">🥇CY</span><span class="award as">AS</span></span>
      </span>
      <span class="numbers"><span class="salary spendy">$28.9M</span><span class="war elite">9.7<span class="unit">WAR</span></span></span>
    </div>
    <div class="row">
      <span class="pos">DH</span>
      <span class="identity">
        <span class="name">Edgar Martínez</span>
        <span class="awards"><span class="award mvp">🥉MVP</span><span class="award ss">SS</span><span class="award as">AS</span></span>
      </span>
      <span class="numbers"><span class="salary">$22.2M</span><span class="war star">7.9<span class="unit">WAR</span></span></span>
    </div>
    <div class="row">
      <span class="pos">CF</span>
      <span class="identity">
        <span class="name">Ken Griffey Jr.</span>
        <span class="awards"><span class="award gg">GG</span><span class="award as">AS</span></span>
      </span>
      <span class="numbers"><span class="salary spendy">$47.0M</span><span class="war mid">3.7<span class="unit">WAR</span></span></span>
    </div>
    </div>
  </div>
</body>
</html>
