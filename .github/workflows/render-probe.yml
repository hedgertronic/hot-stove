# Cross-OS render probe: measures chip vertical centering on engines and
# operating systems nobody's Mac runs (tools/probe_centering.py has the
# method). Manual-dispatch only — it is an instrument, not a gate: emoji
# specimens legitimately differ per platform emoji font, so a hard assert
# would fail on facts. Read the uploaded reports side by side instead.
name: render-probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browsers: chromium
          - os: macos-latest
            browsers: chromium,webkit
          - os: ubuntu-latest
            browsers: chromium,firefox
    runs-on: ${{ matrix.os }}
    # `playwright install --with-deps` can hang instead of failing when a
    # package mirror stops responding, and without a ceiling a job inherits
    # GitHub's 360-minute default. Three legs on the priciest runner tiers
    # makes that an expensive way to learn a mirror was down.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe deps
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps ${BROWSERS//,/ }
        shell: bash
      - name: Probe
        run: python tools/probe_centering.py --browsers ${{ matrix.browsers }} | tee probe-${{ matrix.os }}.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: probe-*.txt
