name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    # Docs and design mocks never reach dist/ — skip the run for them.
    paths-ignore: ["**.md", "design/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level because step `if:` can read the env context but not secrets —
    # this is how the Deploy step knows whether the token exists yet.
    # Account ID is not a secret; inlining it keeps the token the only setup.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6d63b4357cfd12a3d5aaa31e5b5d6863
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # .npmrc ships ignore-scripts=true (supply-chain guard); esbuild's
      # binary arrives as a platform optional dep, so no scripts are needed.
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      # public/data is a symlink into ../../data — the build copies it into
      # dist/data, so the bundle is fully self-contained.
      - run: npm run build
        working-directory: app
      # The lockfile-pinned wrangler pushes dist/ + worker.js to the
      # hot-stove Worker (hedgertronic.com/games/hot-stove*). Skips — green,
      # not red — until the CLOUDFLARE_API_TOKEN repo secret exists, so CI
      # still gates every push in the meantime.
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
        working-directory: app
