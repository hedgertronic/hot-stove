name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    # Docs and design mocks never reach dist/ — skip the run for them.
    paths-ignore: ["**.md", "design/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # .npmrc ships ignore-scripts=true (supply-chain guard); esbuild's
      # binary arrives as a platform optional dep, so no scripts are needed.
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      # The deterministic suite gates deploys. The 1,200-game powerup
      # simulation has its own scheduled/manual workflow because it produces
      # a statistical report and accounts for nearly the entire CI runtime.
      - run: npm test
        working-directory: app
      # The ink probe: real-browser typography gate. Renders the chip and
      # button recipes in Chromium and fails the deploy when any label's cap
      # band sits off its container's center — the regression class unit
      # tests can't see. The browser binary caches on the lockfile hash, so
      # steady-state cost is a few seconds.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:ink
        working-directory: app
      # public/data is a symlink into ../../data — the build copies it into
      # dist/data, so the bundle is fully self-contained.
      - run: npm run build
        working-directory: app

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Account ID is not a secret; inlining it keeps the API token as the only
    # repository-secret setup. A missing token now fails instead of silently
    # producing a green run that did not deploy.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6d63b4357cfd12a3d5aaa31e5b5d6863
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Rebuilding is about two seconds and keeps deployment self-contained;
      # a failed deploy can be retried without repeating the verification job.
      - run: npm run build
        working-directory: app
      # The lockfile-pinned Wrangler deploys the static bundle and worker to
      # hotstove.io, www.hotstove.io, and the legacy redirect route.
      - name: Deploy
        run: npx wrangler deploy
        working-directory: app
