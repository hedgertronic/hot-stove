name: Powerup bot harness

on:
  workflow_dispatch:
  schedule:
    # Weekly regression/research report; it does not block production deploys.
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: powerup-bot-harness
  cancel-in-progress: false

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Runs 400 shared seeds through each of three bots (1,200 full games)
      # and checks that the harness remains meaningful while reporting value.
      - run: npm run test:full
        working-directory: app
